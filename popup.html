<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
    }

    [hidden] {
      display: none !important;
    }

    .container {
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
    }

    .logo svg {
      width: 32px;
      height: 32px;
      color: white;
    }

    h1 {
      color: white;
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .description {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-quick {
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.35);
    }

    .btn-quick:hover {
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.45);
    }

    .download-option {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      color: rgba(255, 255, 255, 0.88);
      font-size: 13px;
      line-height: 1.4;
      cursor: pointer;
    }

    .start-selecting {
      margin-bottom: 0;
    }

    .action-separator {
      margin: 16px 0 14px;
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }

    .download-option input {
      margin-top: 2px;
      accent-color: #3b82f6;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .selector-section {
      margin-top: 22px;
      text-align: left;
    }

    .selector-section h2 {
      color: white;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .hint {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .selector-field {
      position: relative;
    }

    .selector-input {
      width: 100%;
      padding: 8px 42px 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 23, 42, 0.55);
      color: white;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
    }

    .selector-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .selector-input:focus {
      outline: 2px solid rgba(59, 130, 246, 0.7);
      border-color: transparent;
    }

    .selector-action {
      position: absolute;
      top: 2px;
      right: 2px;
      bottom: 2px;
      width: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      box-shadow: none;
      transition: background 0.2s ease;
    }
    .selector-action:hover:not(:disabled) {
      transform: none;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    .selector-action:active {
      transform: none;
      box-shadow: none;
    }

    .selector-action-danger {
      background: rgba(239, 68, 68, 0.88);
    }

    .selector-action-danger:hover:not(:disabled) {
      background: rgba(220, 38, 38, 0.95);
    }

    .selector-action svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn svg {
      width: 20px;
      height: 20px;
    }

    .shortcut {
      margin-top: 16px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
    }

    kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 5px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .features {
      margin-top: 20px;
      text-align: left;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .feature:last-child {
      margin-bottom: 0;
    }

    .feature svg {
      width: 14px;
      height: 14px;
      color: #3b82f6;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
      </svg>
    </div>

    <h1>Quick Copy DOM</h1>
    <p class="description">Select any element on the page and instantly copy its HTML code to your clipboard</p>

    <div class="start-selecting">
      <button class="btn" id="toggleBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
          <path d="M11 8v6M8 11h6"/>
        </svg>
        Start Selecting
      </button>

      <p class="shortcut">Shortcut: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>E</kbd></p>
    </div>

    <hr class="action-separator" aria-hidden="true">
    <div id="quickSection" hidden>
      <button class="btn btn-quick" id="quickBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Quick Selecting
      </button>
    </div>

    <section class="selector-section" aria-label="Selected element">
      <h2>Selected element</h2>
      <!-- <p class="hint">Only the latest element is kept. Clear it to hide Quick Selecting.</p> -->
      <div class="selector-field">
        <input class="selector-input" id="selectorInput" type="text" spellcheck="false" autocomplete="off" placeholder="CSS selector">
        <button type="button" class="btn selector-action" id="selectorActionBtn" aria-label="Save selector" title="Save selector" hidden>
          <svg id="selectorActionIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
            <path d="M17 21v-8H7v8M7 3v5h8"/>
          </svg>
        </button>
      </div>
    </section>

    <label class="download-option">
      <input type="checkbox" id="downloadOnSelection">
      <span>Download HTML when selection</span>
    </label>

    <div class="features">
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Visual element highlighting</span>
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>One-click copy to clipboard</span>
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Press ESC to cancel anytime</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
